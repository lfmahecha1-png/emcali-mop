<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMCALI MOP — Editar Actividad</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23002060'/><text x='50%' y='60%' font-size='18' text-anchor='middle' fill='white' font-weight='bold'>E</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="sidebar-mount"></div>
<div class="app-wrapper">
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="page-content">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 fw-bold" id="formTitle">Nueva Actividad</h5>
        <a href="mop.html" class="btn btn-sm btn-outline-secondary">
          <i class="bi bi-arrow-left me-1"></i>Volver al MOP
        </a>
      </div>

      <form id="actividadForm" novalidate>
        <!-- Sección 1: Jerarquía -->
        <div class="form-section mb-3" style="border-color:var(--mp01);">
          <div class="form-section-title" style="color:var(--mp01);">
            <i class="bi bi-diagram-3 me-1"></i>Jerarquía del Proceso
          </div>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Macroproceso *</label>
              <select class="form-select" id="selMP" required>
                <option value="">Seleccione...</option>
                <option value="MP01">MP01 – Planeación y Evaluación Estratégica</option>
                <option value="MP02">MP02 – Acueducto y Saneamiento Básico</option>
                <option value="MP03">MP03 – Servicios Energéticos</option>
                <option value="MP04">MP04 – Servicios TIC</option>
                <option value="MP05">MP05 – Soporte Corporativo</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Proceso *</label>
              <select class="form-select" id="selProceso" required disabled>
                <option value="">Primero seleccione MP</option>
              </select>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Subproceso *</label>
              <select class="form-select" id="selSubproceso" required disabled>
                <option value="">Primero seleccione Proceso</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Sección 2: Actividad -->
        <div class="form-section mb-3" style="border-color:var(--mp03);">
          <div class="form-section-title" style="color:var(--mp03);">
            <i class="bi bi-list-task me-1"></i>Datos de la Actividad
          </div>
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label small fw-semibold">Código *</label>
              <input type="text" class="form-control" id="actCodigo" placeholder="Ej: A010101003" required>
            </div>
            <div class="col-md-8">
              <label class="form-label small fw-semibold">Descripción *</label>
              <input type="text" class="form-control" id="actDescripcion" placeholder="Nombre de la actividad" required>
            </div>
            <div class="col-md-12">
              <label class="form-label small fw-semibold">Alcance (Inicia / Incluye / Termina)</label>
              <textarea class="form-control" id="actAlcance" rows="3"
                        placeholder="INICIA: Con...&#10;INCLUYE: ...&#10;TERMINA: Con..."></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Indicador (KPI)</label>
              <textarea class="form-control" id="actIndicador" rows="2" placeholder="KPI de la actividad"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Responsable</label>
              <input type="text" class="form-control" id="actResponsable" placeholder="Cargo o área responsable">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Producto / Entregable</label>
              <textarea class="form-control" id="actProducto" rows="2" placeholder="Productos o entregables de la actividad"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Habilitador para los Negocios</label>
              <textarea class="form-control" id="actHabilitador" rows="2" placeholder="Cómo habilita A&A / Energía / TIC"></textarea>
            </div>
            <div class="col-md-12">
              <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="actEsCritica">
                <label class="form-check-label fw-semibold" for="actEsCritica">
                  <span class="badge-critica">⚡ URGENTE</span> Actividad Crítica
                </label>
              </div>
            </div>
            <div class="col-md-12" id="notaCriticaBlock" style="display:none;">
              <label class="form-label small fw-semibold text-danger">Nota / Justificación Urgencia</label>
              <textarea class="form-control border-danger" id="actNotaCritica" rows="2"
                        placeholder="Explique por qué esta actividad es urgente y el impacto de no ejecutarla..."></textarea>
            </div>
          </div>
        </div>

        <!-- Sección 3: Área Funcional -->
        <div class="form-section mb-3" style="border-color:var(--mp04);">
          <div class="form-section-title" style="color:var(--mp04);">
            <i class="bi bi-building me-1"></i>Área Funcional
          </div>
          <div class="row g-3">
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Nombre del Área Funcional</label>
              <input type="text" class="form-control" id="areaNombre" placeholder="Nombre del área">
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">Responsabilidades del Área</label>
              <textarea class="form-control" id="areaResp" rows="2" placeholder="Principales responsabilidades"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">KPI Desempeño del Área</label>
              <textarea class="form-control" id="areaKpiD" rows="2" placeholder="Indicadores de desempeño del área"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">KPI Productividad del Área</label>
              <textarea class="form-control" id="areaKpiP" rows="2" placeholder="Indicadores de productividad del área"></textarea>
            </div>
          </div>
        </div>

        <!-- Sección 4: Funcionario -->
        <div class="form-section mb-3" style="border-color:var(--mp05);">
          <div class="form-section-title" style="color:var(--mp05);">
            <i class="bi bi-person-badge me-1"></i>Funcionario / Cargo
          </div>
          <div class="row g-3">
            <div class="col-md-12">
              <label class="form-label small fw-semibold">Funciones del Funcionario</label>
              <textarea class="form-control" id="funcFunciones" rows="3" placeholder="Descripción de las funciones del cargo en esta actividad"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">KPI Desempeño del Funcionario</label>
              <textarea class="form-control" id="funcKpiD" rows="2" placeholder="Indicadores de desempeño individual"></textarea>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-semibold">KPI Productividad del Funcionario</label>
              <textarea class="form-control" id="funcKpiP" rows="2" placeholder="Indicadores de productividad individual"></textarea>
            </div>
          </div>
        </div>

        <!-- Botones -->
        <div class="d-flex gap-2 justify-content-end mt-4">
          <a href="mop.html" class="btn btn-secondary">
            <i class="bi bi-x-circle me-1"></i>Cancelar
          </a>
          <button type="submit" class="btn btn-primary" id="saveBtn">
            <i class="bi bi-save me-1"></i>Guardar Actividad
          </button>
        </div>
      </form>

    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  if (!Api.requireAuth()) throw new Error('Not logged in');
  if (!Api.requireRole('administrador', 'gestor')) window.location.href = '/mop.html';
  renderLayout('editar', 'Editar / Nueva Actividad');

  const urlParams = new URLSearchParams(window.location.search);
  const editId = urlParams.get('id');
  let mpIdMap = {};  // codigo -> id

  if (editId) {
    document.getElementById('formTitle').innerHTML = `<i class="bi bi-pencil-square me-2"></i>Editar Actividad`;
  }

  // ── CASCADING SELECTS ─────────────────────────────────────
  document.getElementById('selMP').addEventListener('change', async function() {
    const selP = document.getElementById('selProceso');
    const selSP = document.getElementById('selSubproceso');
    selP.innerHTML = '<option value="">Cargando...</option>';
    selP.disabled = true;
    selSP.innerHTML = '<option value="">Primero seleccione Proceso</option>';
    selSP.disabled = true;

    const mps = await Api.macroprocesos();
    const mp = mps.find(m => m.codigo === this.value);
    if (!mp) return;

    const procesos = await Api.procesosPorMP(mp.id);
    selP.innerHTML = '<option value="">Seleccione proceso...</option>' +
      procesos.map(p => `<option value="${p.id}">${p.codigo} — ${p.descripcion?.substring(0,50)||''}</option>`).join('');
    selP.disabled = false;
  });

  document.getElementById('selProceso').addEventListener('change', async function() {
    const selSP = document.getElementById('selSubproceso');
    selSP.innerHTML = '<option value="">Cargando...</option>';
    selSP.disabled = true;
    if (!this.value) return;
    const sps = await Api.subprocesos(this.value);
    selSP.innerHTML = '<option value="">Seleccione subproceso...</option>' +
      sps.map(s => `<option value="${s.id}">${s.codigo} — ${s.descripcion?.substring(0,50)||''}</option>`).join('');
    selSP.disabled = false;
  });

  // Toggle nota crítica
  document.getElementById('actEsCritica').addEventListener('change', function() {
    document.getElementById('notaCriticaBlock').style.display = this.checked ? '' : 'none';
  });

  // ── LOAD FOR EDIT ─────────────────────────────────────────
  async function loadForEdit(id) {
    showLoading();
    try {
      const a = await Api.actividad(id);
      const sp = a.subprocesos || {};
      const p  = sp.procesos   || {};
      const mp = p.macroprocesos || {};
      const af = a.areas_funcionales?.[0] || {};
      const fp = a.funcionarios_proceso?.[0] || {};

      // Set MP and cascade
      document.getElementById('selMP').value = mp.codigo || '';
      await document.getElementById('selMP').dispatchEvent(new Event('change'));

      // Wait for procesos to load then set proceso
      setTimeout(async () => {
        const selP = document.getElementById('selProceso');
        selP.value = p.id || '';
        await selP.dispatchEvent(new Event('change'));
        setTimeout(() => {
          document.getElementById('selSubproceso').value = sp.id || '';
        }, 500);
      }, 600);

      document.getElementById('actCodigo').value       = a.codigo || '';
      document.getElementById('actDescripcion').value  = a.descripcion || '';
      document.getElementById('actAlcance').value      = a.alcance || '';
      document.getElementById('actIndicador').value    = a.indicador || '';
      document.getElementById('actResponsable').value  = a.responsable || '';
      document.getElementById('actProducto').value     = a.producto || '';
      document.getElementById('actHabilitador').value  = a.habilitador_negocio || '';
      document.getElementById('actEsCritica').checked  = a.es_critica || false;
      document.getElementById('actNotaCritica').value  = a.nota_critica || '';
      if (a.es_critica) document.getElementById('notaCriticaBlock').style.display = '';

      document.getElementById('areaNombre').value      = af.nombre || '';
      document.getElementById('areaResp').value        = af.responsabilidades || '';
      document.getElementById('areaKpiD').value        = af.kpi_desempeno || '';
      document.getElementById('areaKpiP').value        = af.kpi_productividad || '';

      document.getElementById('funcFunciones').value   = fp.funciones || '';
      document.getElementById('funcKpiD').value        = fp.kpi_desempeno || '';
      document.getElementById('funcKpiP').value        = fp.kpi_productividad || '';
    } catch (err) {
      toast('Error al cargar la actividad: ' + err.message, 'error');
    } finally {
      hideLoading();
    }
  }

  if (editId) loadForEdit(editId);

  // ── FORM SUBMIT ───────────────────────────────────────────
  document.getElementById('actividadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const spId = document.getElementById('selSubproceso').value;
    if (!spId) { toast('Debe seleccionar el subproceso.', 'error'); return; }
    const codigo = document.getElementById('actCodigo').value.trim();
    if (!codigo) { toast('El código es obligatorio.', 'error'); return; }

    const body = {
      subproceso_id:      parseInt(spId),
      codigo:             codigo,
      descripcion:        document.getElementById('actDescripcion').value.trim(),
      alcance:            document.getElementById('actAlcance').value.trim(),
      indicador:          document.getElementById('actIndicador').value.trim(),
      responsable:        document.getElementById('actResponsable').value.trim(),
      producto:           document.getElementById('actProducto').value.trim(),
      habilitador_negocio: document.getElementById('actHabilitador').value.trim(),
      es_critica:         document.getElementById('actEsCritica').checked,
      nota_critica:       document.getElementById('actNotaCritica').value.trim(),
      area_funcional: {
        nombre:             document.getElementById('areaNombre').value.trim(),
        responsabilidades:  document.getElementById('areaResp').value.trim(),
        kpi_desempeno:      document.getElementById('areaKpiD').value.trim(),
        kpi_productividad:  document.getElementById('areaKpiP').value.trim(),
      },
      funcionario: {
        funciones:          document.getElementById('funcFunciones').value.trim(),
        kpi_desempeno:      document.getElementById('funcKpiD').value.trim(),
        kpi_productividad:  document.getElementById('funcKpiP').value.trim(),
      }
    };

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Guardando...';

    try {
      if (editId) {
        await Api.actualizarActividad(editId, body);
        toast('Actividad actualizada correctamente.', 'success');
      } else {
        await Api.crearActividad(body);
        toast('Actividad creada correctamente.', 'success');
      }
      setTimeout(() => window.location.href = 'mop.html', 1200);
    } catch (err) {
      toast('Error al guardar: ' + err.message, 'error');
      btn.disabled = false;
      btn.innerHTML = '<i class="bi bi-save me-1"></i>Guardar Actividad';
    }
  });
</script>
</body>
</html>
