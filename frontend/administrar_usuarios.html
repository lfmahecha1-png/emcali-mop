<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMCALI MOP — Administrar Usuarios</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23002060'/><text x='50%' y='60%' font-size='18' text-anchor='middle' fill='white' font-weight='bold'>E</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body>
<div id="sidebar-mount"></div>
<div class="app-wrapper">
  <div class="main-content">
    <div id="topbar-mount"></div>
    <div class="page-content">

      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="mb-0 fw-bold"><i class="bi bi-people me-2"></i>Administrar Usuarios</h5>
        <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#userModal" onclick="openCreateModal()">
          <i class="bi bi-person-plus me-1"></i>Nuevo Usuario
        </button>
      </div>

      <!-- Users Table -->
      <div class="card shadow-sm border-0">
        <div class="card-body p-0">
          <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
              <thead class="table-dark">
                <tr>
                  <th>Nombre</th>
                  <th>Email</th>
                  <th>Rol</th>
                  <th class="text-center">Estado</th>
                  <th>Creado</th>
                  <th class="text-center">Acciones</th>
                </tr>
              </thead>
              <tbody id="usersTableBody">
                <tr><td colspan="6" class="text-center py-4">
                  <div class="spinner-border spinner-border-sm me-2"></div>Cargando...
                </td></tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Modal Crear/Editar Usuario -->
<div class="modal fade" id="userModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold" id="userModalTitle">Nuevo Usuario</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <form id="userForm" novalidate>
          <input type="hidden" id="userId">
          <div class="mb-3">
            <label class="form-label small fw-semibold">Nombre completo *</label>
            <input type="text" class="form-control" id="uNombre" placeholder="Nombre del funcionario" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Email *</label>
            <input type="email" class="form-control" id="uEmail" placeholder="usuario@emcali.com.co" required>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Contraseña <span id="pwdHint" class="text-muted">(mínimo 8 caracteres)</span></label>
            <div class="input-group">
              <input type="password" class="form-control" id="uPassword" placeholder="Contraseña segura">
              <button type="button" class="btn btn-outline-secondary" onclick="togglePwd('uPassword')">
                <i class="bi bi-eye"></i>
              </button>
            </div>
            <div class="form-text" id="pwdEditHint" style="display:none;">Dejar vacío para no cambiar la contraseña.</div>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold">Rol *</label>
            <select class="form-select" id="uRol" required>
              <option value="">Seleccione un rol</option>
            </select>
          </div>
          <div class="mb-3" id="activoBlock" style="display:none;">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="uActivo">
              <label class="form-check-label" for="uActivo">Usuario activo</label>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" id="saveUserBtn" onclick="saveUser()">
          <i class="bi bi-save me-1"></i>Guardar
        </button>
      </div>
    </div>
  </div>
</div>

<div id="toastContainer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/api.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  if (!Api.requireAuth()) throw new Error();
  if (!Api.requireRole('administrador')) { window.location.href = '/dashboard.html'; }
  renderLayout('usuarios', 'Administrar Usuarios');

  let roles = [];
  let editingId = null;

  async function loadUsers() {
    try {
      const [users, rolesData] = await Promise.all([Api.usuarios(), Api.roles()]);
      roles = rolesData;
      const rolBadge = { administrador: 'danger', gestor: 'warning', consulta: 'info' };
      const tbody = document.getElementById('usersTableBody');
      tbody.innerHTML = users.map(u => `
        <tr class="${!u.activo ? 'table-secondary text-muted' : ''}">
          <td>
            <div class="d-flex align-items-center gap-2">
              <div class="d-inline-flex align-items-center justify-content-center rounded-circle bg-primary bg-opacity-10 text-primary"
                   style="width:32px;height:32px;font-weight:700;font-size:0.85rem;flex-shrink:0;">
                ${u.nombre.charAt(0).toUpperCase()}
              </div>
              <span class="fw-semibold">${u.nombre}</span>
            </div>
          </td>
          <td><span class="text-muted small">${u.email}</span></td>
          <td><span class="badge bg-${rolBadge[u.roles?.nombre] || 'secondary'}">${u.roles?.nombre || '—'}</span></td>
          <td class="text-center">
            ${u.activo
              ? '<span class="badge bg-success">Activo</span>'
              : '<span class="badge bg-secondary">Inactivo</span>'}
          </td>
          <td><span class="small text-muted">${new Date(u.creado_en).toLocaleDateString('es-CO')}</span></td>
          <td class="text-center">
            <button class="btn btn-sm btn-outline-primary me-1" onclick="openEditModal('${u.id}')">
              <i class="bi bi-pencil"></i>
            </button>
            <button class="btn btn-sm btn-outline-danger" onclick="desactivarUsuario('${u.id}','${u.nombre}')">
              <i class="bi bi-person-x"></i>
            </button>
          </td>
        </tr>
      `).join('');
    } catch (err) {
      toast('Error al cargar usuarios: ' + err.message, 'error');
    }
  }

  function populateRolesSelect(selectedId) {
    const sel = document.getElementById('uRol');
    sel.innerHTML = '<option value="">Seleccione un rol</option>' +
      roles.map(r => `<option value="${r.id}" ${r.id === selectedId ? 'selected' : ''}>${capitalize(r.nombre)}</option>`).join('');
  }

  function capitalize(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  function togglePwd(id) {
    const inp = document.getElementById(id);
    inp.type = inp.type === 'password' ? 'text' : 'password';
  }

  function openCreateModal() {
    editingId = null;
    document.getElementById('userModalTitle').textContent = 'Nuevo Usuario';
    document.getElementById('userForm').reset();
    document.getElementById('pwdEditHint').style.display = 'none';
    document.getElementById('activoBlock').style.display = 'none';
    document.getElementById('uPassword').required = true;
    populateRolesSelect(null);
  }

  async function openEditModal(id) {
    editingId = id;
    const users = await Api.usuarios();
    const u = users.find(x => x.id === id);
    if (!u) return;
    document.getElementById('userModalTitle').textContent = 'Editar Usuario';
    document.getElementById('uNombre').value = u.nombre;
    document.getElementById('uEmail').value  = u.email;
    document.getElementById('uPassword').value = '';
    document.getElementById('uPassword').required = false;
    document.getElementById('pwdEditHint').style.display = '';
    document.getElementById('activoBlock').style.display = '';
    document.getElementById('uActivo').checked = u.activo;
    populateRolesSelect(u.roles?.id);
    new bootstrap.Modal(document.getElementById('userModal')).show();
  }

  async function saveUser() {
    const nombre   = document.getElementById('uNombre').value.trim();
    const email    = document.getElementById('uEmail').value.trim();
    const password = document.getElementById('uPassword').value;
    const rol_id   = parseInt(document.getElementById('uRol').value);
    const activo   = document.getElementById('uActivo').checked;

    if (!nombre || !email || !rol_id) {
      toast('Complete todos los campos obligatorios.', 'error'); return;
    }
    if (!editingId && !password) {
      toast('La contraseña es obligatoria para nuevos usuarios.', 'error'); return;
    }

    const btn = document.getElementById('saveUserBtn');
    btn.disabled = true;
    try {
      if (editingId) {
        const body = { nombre, rol_id, activo };
        if (password) body.password = password;
        await Api.actualizarUsuario(editingId, body);
        toast('Usuario actualizado.', 'success');
      } else {
        await Api.crearUsuario({ nombre, email, password, rol_id });
        toast('Usuario creado correctamente.', 'success');
      }
      bootstrap.Modal.getInstance(document.getElementById('userModal')).hide();
      loadUsers();
    } catch (err) {
      toast('Error: ' + err.message, 'error');
    } finally {
      btn.disabled = false;
    }
  }

  async function desactivarUsuario(id, nombre) {
    if (!confirm(`¿Desactivar al usuario "${nombre}"?`)) return;
    try {
      await Api.desactivarUsuario(id);
      toast('Usuario desactivado.', 'success');
      loadUsers();
    } catch (err) {
      toast('Error: ' + err.message, 'error');
    }
  }

  loadUsers();
</script>
</body>
</html>
