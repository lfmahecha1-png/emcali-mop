<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMCALI MOP — Iniciar Sesión</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%23002060'/><text x='50%' y='60%' font-size='18' text-anchor='middle' fill='white' font-weight='bold'>E</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/styles.css" rel="stylesheet">
</head>
<body class="login-page">
  <div class="login-card">
    <!-- Logo / Branding -->
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-3"
           style="width:70px;height:70px;background:var(--emcali-blue);">
        <span style="font-size:2rem;font-weight:900;color:white;">E</span>
      </div>
      <div class="login-brand">EMCALI EICE ESP</div>
      <div class="text-muted small">Sistema de Gestión del MOP</div>
    </div>

    <!-- Alert -->
    <div id="loginAlert" class="alert alert-danger py-2 d-none" role="alert">
      <i class="bi bi-exclamation-circle me-1"></i>
      <span id="loginAlertMsg">Error</span>
    </div>

    <!-- Form -->
    <form id="loginForm" novalidate>
      <div class="mb-3">
        <label class="form-label fw-semibold small">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="loginEmail"
                 placeholder="usuario@emcali.com.co" required autocomplete="email">
        </div>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold small">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="loginPassword"
                 placeholder="Ingrese su contraseña" required autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" id="togglePwd">
            <i class="bi bi-eye"></i>
          </button>
        </div>
      </div>
      <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold" id="loginBtn">
        <span id="loginBtnText"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar Sesión</span>
        <span id="loginSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
      </button>
    </form>

    <hr class="my-4">
    <div class="text-center text-muted" style="font-size:0.78rem;">
      <i class="bi bi-shield-lock me-1"></i>
      Acceso restringido a funcionarios autorizados.<br>
      EMCALI EICE ESP &copy; 2025
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/api.js"></script>
  <script>
    // Redirect if already logged in
    if (Api.isLoggedIn()) window.location.href = '/dashboard.html';

    // Toggle password visibility
    document.getElementById('togglePwd').addEventListener('click', () => {
      const pwd = document.getElementById('loginPassword');
      const icon = document.querySelector('#togglePwd i');
      if (pwd.type === 'password') { pwd.type = 'text'; icon.className = 'bi bi-eye-slash'; }
      else { pwd.type = 'password'; icon.className = 'bi bi-eye'; }
    });

    // Login form submit
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email    = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;
      const btn      = document.getElementById('loginBtn');
      const spinner  = document.getElementById('loginSpinner');
      const btnText  = document.getElementById('loginBtnText');
      const alert    = document.getElementById('loginAlert');

      alert.classList.add('d-none');
      btn.disabled = true;
      spinner.classList.remove('d-none');
      btnText.classList.add('d-none');

      try {
        const res = await Api.login(email, password);
        Api.saveSession(res.token, res.user);
        window.location.href = '/dashboard.html';
      } catch (err) {
        document.getElementById('loginAlertMsg').textContent = err.message || 'Credenciales inválidas.';
        alert.classList.remove('d-none');
        btn.disabled = false;
        spinner.classList.add('d-none');
        btnText.classList.remove('d-none');
      }
    });
  </script>
</body>
</html>
